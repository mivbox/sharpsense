name: SharpSense CI

# Cancels previous runs for the same PR if you push new commits,
# saving GitHub Actions minutes. Merges to main use run_id and won't cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure browser cache
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/puppeteer" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'
          package_json_file: src/SharpSense.UI/package.json
          run_install: false

      - name: Install frontend dependencies
        working-directory: src/SharpSense.UI
        run: pnpm install --frozen-lockfile

      - name: UI lint and formatting
        working-directory: src/SharpSense.UI
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Install browser and system dependencies
        working-directory: src/SharpSense.UI
        run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" pnpm exec puppeteer browsers install chrome --install-deps

      - name: Build & Test
        run: dotnet test SharpSense.sln -c Release -p:GeneratePackageOnBuild=false

      - name: Check .NET formatting
        run: dotnet format SharpSense.sln --no-restore --severity warn --verify-no-changes --exclude src/SharpSense.Infrastructure/Persistence/Migrations

      - name: Query transport tests
        working-directory: src/SharpSense.UI
        run: pnpm run test:unit

      - name: Browser workflows
        working-directory: src/SharpSense.UI
        run: pnpm run test:e2e
