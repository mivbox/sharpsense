name: SharpSense
run-name: "${{ github.workflow }} - ${{ github.event.pull_request.title || github.ref_name }}"

# 1. If it's a PR, group by workflow + PR number (cancels previous builds of same PR)
# 2. If it's not a PR, group by workflow + run_id (never cancels, as run_id is unique)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
    - main

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Build
        run: dotnet build ./src/SharpSense.Cli/SharpSense.Cli.csproj -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Calculate Semantic Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: versioning
        uses: paulhatch/semantic-version@v5.4.0
        with:
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Pack NuGet Tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          dotnet pack ./src/SharpSense.Cli/SharpSense.Cli.csproj
          -c Release
          /p:PackageVersion=${{ steps.versioning.outputs.version }}
          -o ./artifacts

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: Release ${{ steps.versioning.outputs.version_tag }}
          generate_release_notes: true
