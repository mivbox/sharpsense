name: Release SharpSense

on:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure browser cache
        run: echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/puppeteer" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'
          package_json_file: src/SharpSense.UI/package.json
          run_install: false

      - name: Install frontend dependencies
        working-directory: src/SharpSense.UI
        run: pnpm install --frozen-lockfile

      - name: UI lint and formatting
        working-directory: src/SharpSense.UI
        run: |
          pnpm run lint
          pnpm run format:check

      - name: Install browser and system dependencies
        working-directory: src/SharpSense.UI
        run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" pnpm exec puppeteer browsers install chrome --install-deps

      - name: Calculate Semantic Version
        id: versioning
        uses: paulhatch/semantic-version@v6.0.2
        with:
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Build & Test
        run: >
          dotnet test SharpSense.sln -c Release
          -p:GeneratePackageOnBuild=false
          /p:Version=${{ steps.versioning.outputs.version }}

      - name: Query transport tests
        working-directory: src/SharpSense.UI
        run: pnpm run test:unit

      - name: Browser workflows
        working-directory: src/SharpSense.UI
        run: pnpm run test:e2e

      - name: Pack NuGet Tool
        run: >
          dotnet pack ./src/SharpSense.Cli/SharpSense.Cli.csproj
          -c Release
          --no-build
          /p:Version=${{ steps.versioning.outputs.version }}
          -o ./artifacts

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: Release ${{ steps.versioning.outputs.version_tag }}
          generate_release_notes: true
